<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[即時戰況]2025尾牙 極速變身- Dress Code Dressing Up Show</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 全局設定：深藍色背景，配合你的活動主視覺 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* 深藍漸層 */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05); /* 半透明玻璃質感 */
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            text-align: center;
            color: #FFD700; /* 金黃色標題 */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #a8dce7;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* 狀態燈號 */
        .status-bar {
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer; /* 讓使用者知道可以點擊喚醒 */
        }
        .status-badge {
            display: inline-block;
            padding: 8px 20px; /* 加大一點比較好點 */
            border-radius: 50px;
            font-size: 0.9rem;
            background-color: rgba(0, 255, 127, 0.2);
            color: #00ff7f;
            border: 1px solid #00ff7f;
            transition: all 0.3s;
        }
        .status-badge:hover {
            transform: scale(1.05);
        }

        /* 休眠狀態的樣式 (變灰色) */
        .status-sleep {
            background-color: rgba(255, 255, 255, 0.1) !important;
            color: #ccc !important;
            border-color: #ccc !important;
        }

        /* 圖表容器 RWD 設定 */
        .chart-container {
            position: relative;
            height: 60vh; /* 手機上佔 60% 高度 */
            width: 100%;
        }

        /* 頁尾 */
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 現場人氣投票戰況</h1>
        <div class="subtitle">數據每 1 分鐘自動更新</div>

        <!-- 點擊這個狀態列可以手動喚醒 -->
        <div class="status-bar" onclick="wakeUp()">
            <span id="connectionStatus" class="status-badge">連線中...</span>
        </div>
        
        <div class="chart-container">
            <canvas id="voteChart"></canvas>
        </div>
    </div>

    <div class="footer">Powered by 福委會. v20260115</div>

    <script>
        // =========================================================
        // ⚠️ Google Apps Script 網址 (請確認已加上 ?op=data)
        const API_URL = "https://script.google.com/macros/s/AKfycbyHNNHudJ_yLWlF-9JuEWELq_MGRefaN0zdTzQ0gdXi9_dgx8rCl1Hn4E6fEra7dL1d/exec?op=data"; 
        // =========================================================

        let myChart = null;
        let updateTimer = null; // 用來存計時器，方便我們隨時暫停/啟動
        let errorCount = 0;     // 計算連續錯誤次數，用來做避讓機制
        
        // 🔒 安全機制變數：防止有人掛網吃掉配額
        let activeTime = 0; 
        const MAX_ACTIVE_TIME = 180; // 3分鐘 (180秒) 後自動休眠
        let isSleeping = false;

        // 初始化圖表設定 (已加入數值標籤功能)
        function initChart() {
            const ctx = document.getElementById('voteChart').getContext('2d');
            
            // 設定漸層顏色 (讓長條圖比較有質感)
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(54, 162, 235, 1)');   // 頂部淺藍
            gradient.addColorStop(1, 'rgba(54, 162, 235, 0.2)'); // 底部透明

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [], // 等待 API 資料
                    datasets: [{
                        label: '得票數',
                        data: [],
                        backgroundColor: gradient,
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1,
                        borderRadius: 5,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 30 // ⚠️ 關鍵：上方預留空間，避免數字被切掉
                        }
                    },
                    plugins: {
                        legend: { display: false }, // 隱藏圖例
                        // 自定義數字標籤 (維持你原本要顯示數字的功能)
                        customLabels: { display: true } 
													
												  
						 
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { 
                                color: '#ffffff', 
                                font: { size: 14 }, 
                                stepSize: 1, 
                                precision: 0 
                            } 
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#ffffff', font: { size: 14, weight: 'bold' } }
                        }
                    },
                    animation: {
                        duration: 0 // ✨ 關鍵：關閉動畫，數據一到瞬間顯示，感覺最快
                    }
                },
                // ✨ 新增：自定義插件，用來畫數字
                plugins: [{
                    id: 'customLabels',
                    afterDatasetsDraw(chart, args, options) {
                        const { ctx } = chart;
                        ctx.save();
                        
                        // 設定文字樣式
                        ctx.font = "bold 18px 'Noto Sans TC'"; // 字體大小
                        ctx.fillStyle = '#FFD700'; // 金黃色 (配合標題)，或者用 #ffffff 白色
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';

                        // 遍歷每一個長條
                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((bar, index) => {
                                const data = dataset.data[index];
                                // 避免畫出 0 或者空值 (可選)
                                if (data !== null && data !== undefined) {
                                    // 在長條圖上方 5px 處畫上數字
                                    ctx.fillText(data, bar.x, bar.y - 5);
                                }
                            });
                        });
                        ctx.restore();
                    }
                }]
            });
        }

        // 核心功能：抓取資料
        async function fetchData() {
            // 🛑 流量控制 1: 如果頁面被隱藏 (使用者切換分頁或鎖屏)，就不抓資料，直接跳過
            if (document.hidden) {
                console.log("頁面隱藏中，暫停更新以節省流量...");
                return; // 直接結束，等待下次排程
            }
            
            // 🛑 流量控制 2: 防超時機制 (超過 3 分鐘就停止更新)
            if (activeTime >= MAX_ACTIVE_TIME) {
                goSleep();
                return;
            }

            const statusBadge = document.getElementById('connectionStatus');
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Server busy or error");
                
                const jsonData = await response.json();

                // 更新圖表
                myChart.data.labels = jsonData.map(item => item.team);
                myChart.data.datasets[0].data = jsonData.map(item => item.votes);
                myChart.update();

                // 更新成功，重置錯誤計數
                errorCount = 0;
                
                const now = new Date();
                statusBadge.innerText = "🟢 最後更新: " + now.toLocaleTimeString();
                statusBadge.className = "status-badge"; // 恢復綠燈樣式
                statusBadge.style.color = "#00ff7f";
                statusBadge.style.borderColor = "#00ff7f";

                // 每次成功更新，累加活躍時間 (大約加 60秒)
                activeTime += 60; 

            } catch (error) {
                console.error("Fetch error:", error);
                errorCount++; // 錯誤次數 +1
                
                statusBadge.innerText = "⚠️ 連線繁忙，稍後重試...";
                statusBadge.style.color = "#ffeb3b";
                statusBadge.style.borderColor = "#ffeb3b";
            } finally {
                // 不管成功或失敗，都安排下一次更新
                scheduleNextUpdate();
            }
        }

        // 🛑 流量控制 3: 智慧排程系統
        function scheduleNextUpdate() {
            // 基礎延遲：60秒 ~ 70秒 (大幅降低頻率，節省配額)
            let baseDelay = 60000 + Math.random() * 10000; 

            // 如果連續發生錯誤 (代表伺服器快掛了)，我們就自動把時間拉長
            // 錯誤 1 次 -> 等待時間加倍，讓伺服器喘息
										
																			
            if (errorCount > 0) {
                baseDelay = baseDelay * (errorCount + 1); 
                console.log(`偵測到連線錯誤，下次更新將延後至 ${Math.floor(baseDelay/1000)} 秒後`);
            }

            // 清除舊的計時器 (避免重複執行)
            if (updateTimer) clearTimeout(updateTimer);
            
            updateTimer = setTimeout(() => {
                fetchData();
            }, baseDelay);
        }

        // 進入休眠模式 (停止吃流量)
        function goSleep() {
            isSleeping = true;
            if (updateTimer) clearTimeout(updateTimer);
            
            const statusBadge = document.getElementById('connectionStatus');
            statusBadge.innerText = "💤 已暫停更新 (點擊這裡繼續)";
            statusBadge.className = "status-badge status-sleep"; // 變灰色
        }

        // 喚醒功能 (使用者點擊按鈕，或是重新切換回分頁時觸發)
        function wakeUp() {
            activeTime = 0; // 重置計時
            const statusBadge = document.getElementById('connectionStatus');
            
            if (isSleeping) {
                isSleeping = false;
                statusBadge.innerText = "🔄 重新連線中...";
                statusBadge.className = "status-badge"; // 恢復亮燈
                fetchData(); // 立刻抓一次
            }
        }

        // 監聽頁面狀態：當使用者切換回來時，自動喚醒並更新
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                // 如果之前已經睡著了，或是只是單純切回來，都試著喚醒並更新
                wakeUp(); 
											
            }
        });

        // 程式進入點
        window.onload = function() {
            initChart();           // 1. 畫出空圖表
            
            // ✨ 優化：在 0.5~1.5 秒之間隨機延遲後才發出「第一次」請求
            // 這樣可以避免主持人一喊開始，大家同時按下連結造成瞬間塞車
            // 同時保持「幾乎秒開」的良好體感
            setTimeout(() => {
                fetchData();
            }, 500 + Math.random() * 1000); 
        };
    </script>
</body>
</html>
