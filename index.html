<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[即時戰況]2025尾牙 極速變身- Dress Code Dressing Up Show</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Russo+One&family=Fugaz+One&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           🎨 全局設定：極速橘黑主題 (Race Theme)
           ========================================= */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 背景：深沉的瀝青黑，帶有微微的速度光影放射效果 */
            background: radial-gradient(circle at center, #2b2b2b 0%, #000000 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            /* 容器改為半透明黑色，提升質感 */
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(10px);
            border-radius: 12px; /* 稍微銳利一點的圓角，比較有機械感 */
            padding: 0;
            /* 橘色光暈，營造能量感 */
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.2); 
            border: 1px solid rgba(255, 69, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主視覺 Banner 設定 */
        .kv-banner {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
            /* 底部線條改為亮橘色，呼應主題 */
            border-bottom: 3px solid #ff4500; 
        }
        
        .content-padding {
            padding: 25px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            /* 使用 Fugaz One 字體，自帶斜體速度感 */
            font-family: 'Fugaz One', 'Noto Sans TC', sans-serif; 
            color: #ff8c00; /* 深橘色 */
            /* 文字外發光效果，增加立體感 */
            text-shadow: 2px 2px 0px #000, 0 0 15px rgba(255, 69, 0, 0.8);
            margin: 10px 0;
            font-size: 2rem;
            letter-spacing: 1px;
            font-style: italic; /* 強制斜體增加動感 */
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            color: #ffffff;
            font-size: 0.95rem;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .subtitle span {
            color: #ff4500; /* 強調色 */
        }

        /* 狀態按鈕 - 賽車儀表板風格 */
        .status-bar {
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer; /* 讓使用者知道可以點擊更新 */
            user-select: none; /* 防止點擊時選取文字 */
        }
        .status-badge {
            display: inline-block;
            /* ✨ 調整大小：稍微縮小內距與字體，回歸精緻感 */
            padding: 8px 24px; 
            border-radius: 4px; /* 方形圓角更有機械感 */
            font-size: 0.9rem;
            font-weight: bold;
            /* 橘紅漸層按鈕背景 */
            background: linear-gradient(135deg, #ff4500 0%, #ff8c00 100%);
            color: #000000; /* 黑字對比最強 */
            border: none;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            transition: all 0.2s;
            text-transform: uppercase;
            font-style: italic;
        }
        .status-badge:hover {
            transform: skewX(-10deg) scale(1.05); /* hover 時傾斜，像車子衝出去 */
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.7);
        }
        .status-badge:active {
            transform: scale(0.95); /* 點擊時縮小效果 */
        }

        /* 圖表容器 RWD 設定 */
        .chart-container {
            position: relative;
            height: 55vh; 
            width: 100%;
        }

        /* 頁尾 */
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
            font-family: 'Fugaz One', sans-serif;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 主視覺圖片 (請確保檔名為 kv.jpg) -->
        <img src="kv.jpg" onerror="this.style.display='none'" class="kv-banner" alt="主視覺 Banner">

        <div class="content-padding">
            <h1>🏆 現場人氣投票戰況</h1>
            
            <!-- 修改說明文字，引導使用者手動更新 -->
            <div class="subtitle">
                ⚡️ <span id="hint-text">點擊下方按鈕或重新整理頁面</span> 以更新數據 ⚡️
            </div>

            <!-- 手動更新按鈕 -->
            <div class="status-bar" onclick="manualRefresh()">
                <span id="connectionStatus" class="status-badge">READY TO START</span>
            </div>
            
            <div class="chart-container">
                <canvas id="voteChart"></canvas>
            </div>
        </div>
    </div>

    <div class="footer">Powered by 福委會. vFinal-Orange-Speed</div>

    <script>
        // =========================================================
        // ⚠️ Google Apps Script 網址 (請確認已加上 ?op=data)
        const API_URL = "https://script.google.com/macros/s/AKfycbyHNNHudJ_yLWlF-9JuEWELq_MGRefaN0zdTzQ0gdXi9_dgx8rCl1Hn4E6fEra7dL1d/exec?op=data"; 
        // =========================================================

        let myChart = null;
        let isFetching = false; // 防止使用者瘋狂連點

        // 初始化圖表設定 (已加入數值標籤功能)
        function initChart() {
            const ctx = document.getElementById('voteChart').getContext('2d');
            
            // ✨ 視覺優化：橘紅色火焰漸層
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(255, 69, 0, 0.9)');    // 頂部：火焰紅橘
            gradient.addColorStop(0.5, 'rgba(255, 140, 0, 0.5)'); // 中段：亮橘
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.0)');       // 底部：透明

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: '得票數',
                        data: [],
                        backgroundColor: gradient,
                        borderColor: '#ff4500', // 邊框：亮橘紅色
                        borderWidth: 2,
                        borderRadius: 2, // 稍微方一點，比較硬派
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 40 // ⚠️ 關鍵：上方預留空間，避免數字被切掉
                        }
                    },
                    plugins: {
                        legend: { display: false }, 
                        customLabels: { display: true },
                        tooltip: {
                            backgroundColor: 'rgba(20, 20, 20, 0.9)',
                            titleColor: '#ff8c00',
                            bodyColor: '#ffffff',
                            bodyFont: { size: 14 },
                            borderColor: '#ff4500',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { 
                                color: '#ff8c00', // y軸文字橘色
                                font: { size: 12, family: "'Fugaz One', sans-serif" }, 
                                stepSize: 1, 
                                precision: 0 
                            } 
                        },
                        x: {
                            grid: { display: false },
                            ticks: { 
                                color: '#ffffff', 
                                font: { size: 14, weight: 'bold' } 
                            }
                        }
                    },
                    animation: {
                        duration: 0 // ✨ 關鍵：關閉動畫，數據一到瞬間顯示，感覺最快
                    }
                },
                // ✨ 新增：自定義插件，用來畫數字
                plugins: [{
                    id: 'customLabels',
                    afterDatasetsDraw(chart, args, options) {
                        const { ctx } = chart;
                        ctx.save();
                        
                        // 數字樣式：白色大字 + 黑色陰影 (確保在橘色柱狀圖上也看得清楚)
                        ctx.font = "bold italic 18px 'Noto Sans TC'"; // 賽車字體
                        ctx.fillStyle = '#ffffff'; 
                        //ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
                        //ctx.shadowBlur = 2;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';

                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((bar, index) => {
                                const data = dataset.data[index];
                                if (data !== null && data !== undefined) {
                                    // 在長條圖上方 8px 處畫上數字
                                    ctx.fillText(data, bar.x, bar.y - 8);
                                }
                            });
                        });
                        ctx.restore();
                    }
                }]
            });
        }

        // 核心功能：抓取資料 (單次執行)
        async function fetchData() {
            // 防止重複點擊：如果正在抓資料，就不要再執行
            if (isFetching) return;
            isFetching = true;

            const statusBadge = document.getElementById('connectionStatus');
            
            // 點擊後顯示狀態 (模擬引擎啟動)
            statusBadge.innerText = "🔥 BOOSTING...";
            statusBadge.style.background = "linear-gradient(135deg, #ff8c00 0%, #ff4500 100%)";
            statusBadge.style.color = "#000";
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Server busy or error");
                
                const jsonData = await response.json();

                // 更新圖表
                myChart.data.labels = jsonData.map(item => item.team);
                myChart.data.datasets[0].data = jsonData.map(item => item.votes);
                myChart.update();

                const now = new Date();
                // 目前使用簡潔的時間顯示
                statusBadge.innerText = "REFRESHED ( Last Updated:" + now.toLocaleTimeString() + ")";
                statusBadge.style.background = "#222"; // 變回深色底
                statusBadge.style.color = "#ff8c00";   // 橘色字
                statusBadge.style.border = "1px solid #ff8c00";

            } catch (error) {
                console.error("Fetch error:", error);
                
                statusBadge.innerText = "⚠️ RETRY";
                statusBadge.style.background = "#333";
                statusBadge.style.color = "#ffff00";
            } finally {
                isFetching = false; // 解除鎖定
            }
        }

        // 手動更新按鈕觸發的函式
        function manualRefresh() {
            fetchData();
        }

        // 監聽頁面狀態：當使用者「切換回來」時，自動幫他更新一次 (貼心功能)
        // 雖然是手動版，但這個功能不消耗背景流量，卻能提升體驗，建議保留
        // 目前已註解掉，若需要可開啟
        //document.addEventListener("visibilitychange", () => {
        //    if (!document.hidden) {
        //        console.log("使用者回來了，自動更新一次數據！");
        //        fetchData(); 
        //    }
        //});

        // 程式進入點
        window.onload = function() {
            initChart();           // 1. 畫出空圖表
            
            // ✨ 優化：在 0.5~1.5 秒之間隨機延遲後才發出「第一次」請求
            // 這是為了防止主持人喊開始時的瞬間爆量，之後就靠使用者手動更新了
            setTimeout(() => {
                fetchData();
            }, 500 + Math.random() * 1000); 
        };
    </script>
</body>
</html>
